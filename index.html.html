<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>インスリンくんのブドウ糖お届け便</title>
<style>
body{margin:0;overflow:hidden;background:#fff3dc;font-family:system-ui,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,243,220,.88);z-index:9}
.panel{width:min(90vw,460px);background:#fffaf0;border:3px solid #7a5a40;border-radius:28px;text-align:center;padding:26px 22px;box-shadow:0 12px 0 rgba(122,90,64,.18)}
h1{margin:0 0 12px;color:#5a3e2b;font-size:28px;line-height:1.35}
p{color:#5a3e2b;font-weight:700;line-height:1.75}
button{margin-top:14px;padding:14px 30px;border-radius:999px;border:2px solid #5a3e2b;background:#f2bd8b;color:#3b281c;font-size:18px;font-weight:900;box-shadow:0 5px 0 #7a5a40}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a40}
#over{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="start" class="overlay">
  <div class="panel">
    <h1>インスリンくんの<br>ブドウ糖お届け便</h1>
    <p>インスリンくんを動かして、<br>青いブドウ糖を細胞へ届けよう。</p>
    <p>紫のじゃまものに当たると、<br>届けにくくなります。</p>
    <button onclick="startGame()">はじめる</button>
  </div>
</div>

<div id="over" class="overlay">
  <div class="panel">
    <h1>おつかれさま</h1>
    <p id="result"></p>
    <p id="lesson"></p>
    <button onclick="startGame()">もう一度あそぶ</button>
  </div>
</div>

<script>
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
let W,H,ratio,player,balls,enemies,cells,parts,targetX,targetY,score,miss,time,run,frame,bt,et,msg,msgT;
function resize(){ratio=devicePixelRatio||1;canvas.width=innerWidth*ratio;canvas.height=innerHeight*ratio;canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";ctx.setTransform(ratio,0,0,ratio,0,0);W=innerWidth;H=innerHeight}
resize();addEventListener("resize",resize);
function reset(){player={x:W*.18,y:H*.5,r:24,hold:null,hit:0};balls=[];enemies=[];parts=[];cells=[{n:"筋肉",x:W*.82,y:H*.25,c:"#f7b3a6"},{n:"肝臓",x:W*.82,y:H*.50,c:"#ef6f77"},{n:"脂肪",x:W*.82,y:H*.75,c:"#f6c453"}];targetX=player.x;targetY=player.y;score=0;miss=0;time=60;run=true;frame=0;bt=0;et=0;msg="ブドウ糖を細胞へ届けよう";msgT=140}
function startGame(){document.getElementById("start").style.display="none";document.getElementById("over").style.display="none";reset();requestAnimationFrame(loop)}
function endGame(){run=false;document.getElementById("result").textContent="届けたブドウ糖："+score+"こ";let l="ブドウ糖は、インスリンの働きで細胞に取り込まれます。";if(score>=10)l="インスリンが働くと、ブドウ糖は筋肉・肝臓・脂肪などの細胞へ入りやすくなります。";if(score>=20)l="食事・運動・休養・必要な治療を続けることが、血糖管理につながります。";document.getElementById("lesson").textContent=l;document.getElementById("over").style.display="flex"}
function setT(x,y){targetX=x;targetY=y}canvas.addEventListener("mousedown",e=>setT(e.clientX,e.clientY));canvas.addEventListener("mousemove",e=>{if(e.buttons===1)setT(e.clientX,e.clientY)});canvas.addEventListener("touchstart",e=>{let t=e.touches[0];setT(t.clientX,t.clientY)},{passive:true});canvas.addEventListener("touchmove",e=>{e.preventDefault();let t=e.touches[0];setT(t.clientX,t.clientY)},{passive:false});
function d(a,b,c,e){return Math.hypot(a-c,b-e)}
function spawnBall(){balls.push({x:35+Math.random()*W*.45,y:100+Math.random()*(H-200),r:13+Math.random()*4,vx:.4+Math.random()*.5,t:Math.random()*7})}
function spawnEnemy(){enemies.push({x:W+40,y:100+Math.random()*(H-200),r:20+Math.random()*8,vx:-1.5-Math.random()*1.2,t:Math.random()*7})}
function burst(x,y,col){for(let i=0;i<14;i++)parts.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:45,s:4+Math.random()*5,c:col})}
function update(){frame++;if(frame%60===0){time--;if(time<=0)endGame()}if(msgT>0)msgT--;if(player.hit>0)player.hit--;player.x+=(targetX-player.x)*.16;player.y+=(targetY-player.y)*.16;player.x=Math.max(30,Math.min(W-30,player.x));player.y=Math.max(84,Math.min(H-35,player.y));bt++;if(bt>Math.max(26,58-score*.5)){spawnBall();bt=0}et++;if(et>Math.max(72,160-score*2)){spawnEnemy();et=0}balls.forEach(b=>{b.x+=b.vx;b.y+=Math.sin(frame/25+b.t)*.25});balls=balls.filter(b=>{if(b.x>W+40){miss++;return false}return true});enemies.forEach(e=>{e.x+=e.vx;e.y+=Math.sin(frame/28+e.t)*.7});enemies=enemies.filter(e=>e.x>-60);if(!player.hold){for(let i=balls.length-1;i>=0;i--){let b=balls[i];if(d(player.x,player.y,b.x,b.y)<player.r+b.r+5){player.hold=b;balls.splice(i,1);burst(b.x,b.y,"#f0cf74");msg="細胞へ届けよう";msgT=75;break}}}else{player.hold.x=player.x+22;player.hold.y=player.y-23;for(let c of cells){if(d(player.x,player.y,c.x,c.y)<player.r+48){score++;burst(c.x,c.y,c.c);player.hold=null;msg=c.n+"に届いた！";msgT=80;break}}}for(let e of enemies){if(player.hit<=0&&d(player.x,player.y,e.x,e.y)<player.r+e.r){player.hit=90;miss++;burst(player.x,player.y,"#b8a4f4");if(player.hold){player.hold=null}msg="じゃまものに当たった！";msgT=85;if(miss>=5){endGame();return}}}parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.02;p.life--});parts=parts.filter(p=>p.life>0)}
function blob(x,y,rx,ry,fill,stroke="#5a3e2b",lw=2){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}
function rr(x,y,w,h,r,fill,stroke="#5a3e2b"){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=stroke;ctx.stroke()}
function bg(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#dceef1");g.addColorStop(.55,"#fff3dc");g.addColorStop(1,"#dce9c5");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.10;for(let i=0;i<85;i++){ctx.beginPath();ctx.arc((i*83)%W,(i*127)%H,1.4,0,Math.PI*2);ctx.fillStyle="#7a5a40";ctx.fill()}ctx.globalAlpha=1;ctx.save();ctx.lineCap="round";ctx.strokeStyle="#f18fa0";ctx.lineWidth=Math.min(70,W*.14);ctx.beginPath();ctx.moveTo(-30,H*.50);ctx.bezierCurveTo(W*.23,H*.35,W*.45,H*.64,W*.66,H*.47);ctx.stroke();ctx.strokeStyle="#e95775";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-30,H*.50);ctx.bezierCurveTo(W*.23,H*.35,W*.45,H*.64,W*.66,H*.47);ctx.stroke();ctx.restore();for(let i=0;i<15;i++){let x=(frame*.75+i*53)%(W*.70),y=H*.50+Math.sin(i+frame*.025)*45;blob(x,y,8,8,i%2?"#ef476f":"#ff7b8f","rgba(90,62,43,.25)",1)}}
function drawCells(){cells.forEach(c=>{let pulse=1+Math.sin(frame*.04+c.x)*.025;blob(c.x,c.y,52*pulse,43*pulse,c.c,"#7a5a40",2);ctx.fillStyle="#5a3e2b";ctx.textAlign="center";ctx.font="bold 15px system-ui";ctx.fillText(c.n,c.x,c.y+5);ctx.fillStyle="rgba(255,250,240,.7)";ctx.beginPath();ctx.roundRect(c.x-18,c.y+22,36,12,6);ctx.fill();ctx.textAlign="left"})}
function drawBall(b){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.sin(frame*.04+b.t)*.15);blob(0,0,b.r,b.r,"#91a7ff","#5a3e2b",1.5);ctx.fillStyle="#3f2d22";ctx.beginPath();ctx.arc(-4,-2,1.8,0,Math.PI*2);ctx.arc(4,-2,1.8,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#3f2d22";ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(0,2,4,.1*Math.PI,.9*Math.PI);ctx.stroke();ctx.restore()}
function drawEnemy(e){ctx.save();ctx.translate(e.x,e.y);ctx.rotate(Math.sin(frame*.04+e.t)*.2);ctx.fillStyle="#9b5de5";ctx.strokeStyle="#5a3e2b";ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<14;i++){let a=i/14*Math.PI*2,r=i%2?e.r*.78:e.r*1.25,x=Math.cos(a)*r,y=Math.sin(a)*r;if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y)}ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle="#fffaf0";ctx.beginPath();ctx.arc(-6,-3,3,0,Math.PI*2);ctx.arc(6,-3,3,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fffaf0";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,8,7,Math.PI*.1,Math.PI*.9,true);ctx.stroke();ctx.restore()}
function drawPlayer(){ctx.save();ctx.translate(player.x,player.y);if(player.hit>0&&Math.floor(frame/5)%2===0)ctx.globalAlpha=.45;blob(0,0,player.r,player.r*1.15,"#f7d35f","#5a3e2b",2);rr(-15,-35,30,15,7,"#9bd18b","#5a3e2b");ctx.strokeStyle="#5a3e2b";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-20,1);ctx.lineTo(-35,-8+Math.sin(frame*.1)*5);ctx.moveTo(20,1);ctx.lineTo(35,-8-Math.sin(frame*.1)*5);ctx.stroke();ctx.fillStyle="#3f2d22";ctx.beginPath();ctx.arc(-8,-6,3,0,Math.PI*2);ctx.arc(8,-6,3,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#3f2d22";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,3,8,.12*Math.PI,.88*Math.PI);ctx.stroke();ctx.fillStyle="#5a3e2b";ctx.font="bold 10px system-ui";ctx.textAlign="center";ctx.fillText("インスリン",0,35);ctx.restore();if(player.hold)drawBall(player.hold)}
function drawParts(){parts.forEach(p=>{ctx.save();ctx.globalAlpha=Math.max(0,p.life/45);ctx.translate(p.x,p.y);ctx.rotate(frame*.04);ctx.fillStyle=p.c;ctx.beginPath();ctx.moveTo(0,-p.s);ctx.lineTo(p.s*.35,-p.s*.35);ctx.lineTo(p.s,0);ctx.lineTo(p.s*.35,p.s*.35);ctx.lineTo(0,p.s);ctx.lineTo(-p.s*.35,p.s*.35);ctx.lineTo(-p.s,0);ctx.lineTo(-p.s*.35,-p.s*.35);ctx.closePath();ctx.fill();ctx.restore();ctx.globalAlpha=1})}
function ui(){rr(12,12,Math.min(245,W-24),78,18,"rgba(255,250,240,.86)","#7a5a40");ctx.fillStyle="#5a3e2b";ctx.font="bold 15px system-ui";ctx.fillText("届けた数 "+score+"こ",28,39);ctx.fillText("時間 "+time+"秒",28,63);let bw=Math.min(120,W-138);ctx.fillStyle="#e8d7c0";ctx.beginPath();ctx.roundRect(120,52,bw,12,6);ctx.fill();ctx.fillStyle=miss>=4?"#ef476f":"#8fd19e";ctx.beginPath();ctx.roundRect(120,52,bw*Math.max(0,(5-miss)/5),12,6);ctx.fill();ctx.fillStyle="#5a3e2b";ctx.font="bold 11px system-ui";ctx.fillText("届けやすさ",120,45);if(msgT>0){ctx.textAlign="center";ctx.font="bold 18px system-ui";let w=Math.min(W-30,290);rr(W/2-w/2,H-76,w,46,23,"rgba(255,250,240,.9)","#7a5a40");ctx.fillStyle="#5a3e2b";ctx.fillText(msg,W/2,H-47);ctx.textAlign="left"}if(W>370){rr(W*.34-82,14,164,38,16,"rgba(255,250,240,.75)","#7a5a40");ctx.textAlign="center";ctx.font="bold 13px system-ui";ctx.fillStyle="#5a3e2b";ctx.fillText("青丸＝ブドウ糖",W*.34,39);ctx.textAlign="left"}}
function draw(){ctx.clearRect(0,0,W,H);bg();drawCells();balls.forEach(drawBall);enemies.forEach(drawEnemy);drawParts();drawPlayer();ui()}
function loop(){if(!run)return;update();draw();requestAnimationFrame(loop)}
</script>
</body>
</html>
