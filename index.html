<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ABYSS GLOW - 深海シューティング</title>
<style>
:root{--txt:#e2ffff;--aqua:#56f4ec;--panel:rgba(3,21,43,.80);--line:rgba(93,240,239,.34);--danger:#ff628d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} html,body{margin:0;height:100%;overflow:hidden;touch-action:none;background:#010714;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
body{display:grid;place-items:center} #app{position:relative;height:100dvh;max-width:100vw;aspect-ratio:9/16;overflow:hidden;background:#02112a;box-shadow:0 0 40px rgba(31,169,184,.3)} canvas{width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;font-weight:800;font-size:11px;letter-spacing:.08em;text-shadow:0 2px 5px #000}.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:96px}#score{font-size:18px}.right{text-align:right}
#gauge{position:absolute;top:max(63px,calc(env(safe-area-inset-top) + 53px));left:10px;right:10px;display:flex;gap:8px;align-items:center;font-size:10px;font-weight:900;pointer-events:none}.bar{height:8px;flex:1;border-radius:10px;background:rgba(255,255,255,.12);overflow:hidden}#hp{width:100%;height:100%;background:linear-gradient(90deg,#30dcae,#61f3ed)}
#boss{display:none;position:absolute;top:max(87px,calc(env(safe-area-inset-top) + 77px));left:22px;right:22px;gap:8px;align-items:center;color:#ff9db6;font-size:10px;font-weight:900;pointer-events:none}#bossHp{width:100%;height:100%;background:linear-gradient(90deg,#ff4b7b,#fb9a64)}
#actions{position:absolute;right:10px;bottom:max(13px,env(safe-area-inset-bottom));z-index:5;display:flex;align-items:flex-end;gap:9px}
#sound{position:static;height:40px;min-width:60px;border-radius:22px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-weight:800}
#fire{width:84px;height:84px;border-radius:50%;border:2px solid rgba(105,255,251,.8);background:radial-gradient(circle at 38% 32%,#a6fffc 0%,#28e2df 20%,#0ca1b8 53%,#06334c 100%);color:#f1ffff;font-size:13px;font-weight:950;letter-spacing:.08em;box-shadow:0 0 22px rgba(61,245,242,.5),inset 0 0 10px rgba(255,255,255,.2);touch-action:none}
#fire:active{transform:scale(.95);box-shadow:0 0 29px rgba(78,255,251,.74),inset 0 0 16px rgba(255,255,255,.34)}
#announce{position:absolute;left:0;right:0;top:27%;text-align:center;pointer-events:none;font-size:23px;font-weight:950;letter-spacing:.13em;text-shadow:0 0 18px #34eded;opacity:0;transform:scale(.93);transition:.18s}#announce.on{opacity:1;transform:scale(1)}
#guide{position:absolute;bottom:max(29px,calc(env(safe-area-inset-bottom) + 23px));left:8px;right:112px;text-align:center;color:rgba(210,251,255,.63);font-size:11px;letter-spacing:.08em;pointer-events:none;transition:opacity .5s}
.screen{position:absolute;z-index:10;inset:0;padding:25px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:linear-gradient(180deg,rgba(1,9,24,.25),rgba(1,8,22,.93))}.hide{display:none}h1{margin:0;color:#f3ffff;font-size:32px;line-height:1.03;font-weight:950;letter-spacing:.16em;text-shadow:0 0 21px rgba(54,235,237,.82)}.sub{font-size:14px;font-weight:900;letter-spacing:.25em;color:#68e6e7;margin:11px 0 23px}.desc{width:100%;padding:16px 10px;margin:0 0 23px;border-radius:17px;border:1px solid var(--line);background:rgba(3,20,41,.68);font-size:13px;line-height:1.82}.primary{width:86%;height:53px;border:0;border-radius:17px;font-weight:950;letter-spacing:.13em;font-size:15px;color:#032338;background:linear-gradient(90deg,#54f2ed,#aeffff);box-shadow:0 0 20px rgba(57,228,233,.38)}#result{font-size:14px;line-height:2.15;margin:19px 0 23px}
</style>
</head>
<body><div id="app">
<canvas id="game" aria-label="深海シューティングゲーム"></canvas>
<div id="hud"><div class="box">SCORE<br><span id="score">000000</span></div><div class="box right">DEPTH <span id="wave">1</span><br>HIGH <span id="high">000000</span></div></div>
<div id="gauge"><span>艇体</span><div class="bar"><div id="hp"></div></div></div><div id="boss"><span>巨大生物</span><div class="bar"><div id="bossHp"></div></div></div>
<div id="announce"></div><div id="guide">スワイプ：移動</div><div id="actions"><button id="sound" type="button">音 ON</button><button id="fire" type="button">発光弾</button></div>
<section id="title" class="screen"><h1>ABYSS<br>GLOW</h1><div class="sub">深海調査作戦</div><div class="desc">光る深海調査艇を操作して未知の生物を回避しよう<br><b>発光弾ボタン</b>で攻撃 ／ <b>画面スワイプ</b>で移動<br>深度が上がると、巨大ダイオウイカが出現</div><button id="start" class="primary">DIVE START</button></section>
<section id="over" class="screen hide"><h1>DIVE<br>FAILED</h1><div id="result"></div><button id="retry" class="primary">RETRY</button></section>
</div>
<script>
(()=>{'use strict';
const W=390,H=693,D=Math.min(devicePixelRatio||1,2),c=document.getElementById('game'),x=c.getContext('2d'),$=id=>document.getElementById(id);
const scoreE=$('score'),waveE=$('wave'),highE=$('high'),hpE=$('hp'),bossUI=$('boss'),bossHpE=$('bossHp'),sayE=$('announce'),title=$('title'),over=$('over'),result=$('result'),guide=$('guide');
function size(){c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)} size(); addEventListener('resize',size);
const audio={ctx:null,g:null,mute:false,timer:null,n:0,async start(){if(!this.ctx){this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.g=this.ctx.createGain();this.g.gain.value=this.mute?0:.4;this.g.connect(this.ctx.destination)}if(this.ctx.state==='suspended')await this.ctx.resume();this.music()},tone(f,d,type='sine',vol=.1,end=0){if(!this.ctx||this.mute)return;let t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(end)o.frequency.exponentialRampToValueAtTime(end,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(this.g);o.start(t);o.stop(t+d+.03)},shot(){this.tone(740,.08,'sine',.07,380)},hit(){this.tone(130,.1,'triangle',.07,58)},hurt(){this.tone(82,.32,'sawtooth',.13,37)},item(){this.tone(420,.12,'sine',.1,820);setTimeout(()=>this.tone(660,.13,'sine',.09,1060),70)},warning(){this.tone(51,.75,'sawtooth',.12,29)},win(){this.tone(220,.17,'triangle',.1,440);setTimeout(()=>this.tone(440,.34,'sine',.1,850),140)},music(){if(this.timer)return;let notes=[55,65.4,73.4,49];let pulse=()=>{if(running){let f=notes[this.n++%notes.length];this.tone(f,1.65,'sine',.035,f*.98);this.tone(f*2,1.1,'triangle',.014,f*1.8)}};pulse();this.timer=setInterval(pulse,1800)},stop(){clearInterval(this.timer);this.timer=null},toggle(){this.mute=!this.mute;$('sound').textContent=this.mute?'音 OFF':'音 ON';if(this.g)this.g.gain.setTargetAtTime(this.mute?0:.4,this.ctx.currentTime,.04)}};
$('sound').onclick=e=>{e.stopPropagation();audio.toggle()};$('fire').oncontextmenu=e=>e.preventDefault();
let running=false,last=0,time=0,spawn=0,wave=1,lastWave=1,score=0,high=+(localStorage.getItem('abyss_high')||0),nextBoss=1100,flash=0,shake=0,player,bullets=[],enemies=[],bad=[],parts=[],items=[],dust=[],bubbles=[],boss=null,touch={}; highE.textContent=String(high).padStart(6,'0');
function bubble(y=H+12){return{x:15+Math.random()*(W-30),y,r:2+Math.random()*7,v:.24+Math.random()*.72,a:.12+Math.random()*.2}}
function reset(){time=0;spawn=0;wave=lastWave=1;score=0;nextBoss=1100;flash=shake=0;bullets=[];enemies=[];bad=[];parts=[];items=[];boss=null;player={x:W/2,y:H-101,r:17,hp:100,inv:0,shield:0,power:1,powerAt:0};dust=[];bubbles=[];for(let i=0;i<56;i++)dust.push({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*2,v:.18+Math.random()*.8,a:.17+Math.random()*.52});for(let i=0;i<17;i++)bubbles.push(bubble(Math.random()*H));hud()}
function hud(){scoreE.textContent=String(score).padStart(6,'0');waveE.textContent=wave;highE.textContent=String(high).padStart(6,'0');hpE.style.width=Math.max(0,player.hp)+'%';hpE.style.background=player.hp<30?'linear-gradient(90deg,#ff3d71,#ffa16b)':'linear-gradient(90deg,#30dcae,#61f3ed)';if(boss&&!boss.dead){bossUI.style.display='flex';bossHpE.style.width=(boss.hp/boss.max*100)+'%'}else bossUI.style.display='none'}
function say(s){sayE.textContent=s;sayE.classList.add('on');clearTimeout(say.t);say.t=setTimeout(()=>sayE.classList.remove('on'),920)}
function start(){audio.start();reset();title.classList.add('hide');over.classList.add('hide');running=true;guide.style.opacity=1;setTimeout(()=>{if(running)guide.style.opacity=.2},2600);last=performance.now();say('深度 1');requestAnimationFrame(loop)} $('start').onclick=start;$('retry').onclick=start;
function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
c.onpointerdown=e=>{if(!running)return;e.preventDefault();let p=pos(e);touch={id:e.pointerId,down:true,sx:p.x,sy:p.y,moved:false,at:performance.now()};c.setPointerCapture(e.pointerId)};
c.onpointermove=e=>{if(!running||!touch.down||e.pointerId!==touch.id)return;e.preventDefault();let p=pos(e);if(Math.hypot(p.x-touch.sx,p.y-touch.sy)>8)touch.moved=true;if(touch.moved){player.x=Math.max(23,Math.min(W-23,p.x));player.y=Math.max(120,Math.min(H-50,p.y))}};
c.onpointerup=e=>{if(!running||!touch.down||e.pointerId!==touch.id)return;e.preventDefault();touch.down=false};c.onpointercancel=()=>touch.down=false;
$('fire').onpointerdown=e=>{e.preventDefault();e.stopPropagation();if(running)fire()};
function fire(){let angles=player.power>1?[-.12,.12]:[0];angles.forEach(a=>bullets.push({x:player.x,y:player.y-22,vx:Math.sin(a)*6,vy:-8.7,r:4,d:1}));audio.shot()}
function level(){return 1+time/21000+score/1900}
function spawnEnemy(type){let d=level(),px=30+Math.random()*(W-60);let t={angler:{r:20,hp:2,v:1.05+d*.2,pts:90,col:'#f0bd46'},squid:{r:23,hp:4,v:.77+d*.18,pts:150,col:'#e96ccc'},mega:{r:27,hp:7,v:.58+d*.15,pts:245,col:'#43dfbd'}}[type];enemies.push({...t,type,x:px,y:-48,t:Math.random()*6,shoot:80+Math.random()*30,max:t.hp})}
function summon(){bad=[];let hp=56+wave*8;boss={type:'boss',x:W/2,y:-100,r:58,hp,max:hp,v:.48,t:0,shoot:70,pts:1000,col:'#dc5aac',boss:true};enemies.push(boss);audio.warning();say('巨大ダイオウイカ 出現');hud()}
function blast(px,py,col,n=12){for(let i=0;i<n;i++){let a=Math.random()*6.283,v=.45+Math.random()*3;parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:1+Math.random()*3,a:1,col})}}
function aim(e,triple=false){let a=Math.atan2(player.y-e.y,player.x-e.x);(triple?[-.34,0,.34]:[0]).forEach(q=>bad.push({x:e.x,y:e.y+e.r*.45,vx:Math.cos(a+q)*2.15,vy:Math.sin(a+q)*2.15,r:triple?5:4,col:'#ff72a0'}))}
function hit(e,d=1){if(e.dead)return;e.hp-=d;blast(e.x,e.y,e.col,3);audio.hit();if(e.hp<=0){e.dead=true;score+=e.pts;blast(e.x,e.y,e.col,e.boss?48:17);if(e.boss){boss=null;nextBoss+=1700;score+=450;flash=13;audio.win();say('巨大生物を退けた！')}else if(Math.random()<.11)items.push({x:e.x,y:e.y,r:12,v:1.25,t:0,type:Math.random()<.5?'shield':'power'});if(score>high){high=score;localStorage.setItem('abyss_high',high)}hud()}}
function hurt(n){if(player.inv)return;if(player.shield){player.shield=0;player.inv=24;blast(player.x,player.y,'#69ffff',24);audio.item();return}player.hp-=n;player.inv=72;shake=12;flash=8;blast(player.x,player.y,'#6cf6ff',22);audio.hurt();hud();if(player.hp<=0)end()}
function end(){running=false;audio.stop();result.innerHTML=`SCORE　<b>${String(score).padStart(6,'0')}</b><br>到達深度　<b>${wave}</b><br>HIGH SCORE　<b>${String(high).padStart(6,'0')}</b>`;over.classList.remove('hide')}
function update(dt){time+=dt;let d=level();wave=Math.max(1,Math.floor(time/15000)+Math.floor(score/800)+1);if(wave!==lastWave){lastWave=wave;say('深度 '+wave);hud()}player.inv=Math.max(0,player.inv-1);if(player.power>1&&time-player.powerAt>10000)player.power=1;dust.forEach(p=>{p.y+=p.v*(.8+d*.05);if(p.y>H+3){p.y=-3;p.x=Math.random()*W}});bubbles.forEach(p=>{p.y-=p.v;if(p.y<-12)Object.assign(p,bubble())});if(score>=nextBoss&&!boss&&!enemies.some(e=>e.boss))summon();if(!boss){spawn-=dt;if(spawn<=0){let r=Math.random();spawnEnemy(r<.5?'angler':r<.8?'squid':'mega');spawn=Math.max(245,870-d*90)+Math.random()*180}}
 bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy});bullets=bullets.filter(b=>!b.dead&&b.y>-25&&b.x>-15&&b.x<W+15);
 enemies.forEach(e=>{e.t+=.045;if(e.boss){if(e.y<105)e.y+=e.v;else e.x=W/2+Math.sin(e.t*.65)*108;if(--e.shoot<=0){aim(e,true);e.shoot=Math.max(34,70-d*4)}}else{e.y+=e.v;if(e.type==='squid')e.x+=Math.sin(e.t)*1.65;if(e.type==='mega')e.x+=Math.cos(e.t*.7)*.75;if(e.type!=='angler'&&--e.shoot<=0&&e.y>30&&e.y<H*.62){aim(e);e.shoot=e.type==='mega'?84:112}if(e.y>H+45){e.dead=true;hurt(7)}}bullets.forEach(b=>{if(!b.dead&&!e.dead&&Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r*.75){b.dead=true;hit(e,b.d)}});if(!e.dead&&Math.hypot(player.x-e.x,player.y-e.y)<player.r+e.r*.75){if(!e.boss)e.dead=true;hurt(e.boss?32:22)}});enemies=enemies.filter(e=>!e.dead);
 bad.forEach(b=>{b.x+=b.vx;b.y+=b.vy;if(!b.dead&&Math.hypot(player.x-b.x,player.y-b.y)<player.r+b.r){b.dead=true;hurt(13)}});bad=bad.filter(b=>!b.dead&&b.y<H+20&&b.x>-20&&b.x<W+20);
 items.forEach(p=>{p.y+=p.v;p.t+=.1;if(Math.hypot(player.x-p.x,player.y-p.y)<player.r+p.r+4){p.dead=true;if(p.type==='shield'){player.shield=1;say('発光バリア')}else{player.power=2;player.powerAt=time;say('発光弾 強化')}audio.item();blast(p.x,p.y,p.type==='shield'?'#66f9ff':'#ffe875',23)}});items=items.filter(p=>!p.dead&&p.y<H+22);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy*=.97;p.a-=.043;p.r*=.988});parts=parts.filter(p=>p.a>0);shake=Math.max(0,shake-1);flash=Math.max(0,flash-1)}
function glow(px,py,r,col,blur=12){x.save();x.fillStyle=col;x.shadowColor=col;x.shadowBlur=blur;x.beginPath();x.arc(px,py,r,0,7);x.fill();x.restore()}
function bg(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#041c3b');g.addColorStop(.45,'#03142e');g.addColorStop(1,'#010816');x.fillStyle=g;x.fillRect(-20,-20,W+40,H+40);x.globalAlpha=.12;x.fillStyle='#14aeb6';x.beginPath();x.ellipse(70,240,115,185,0,0,7);x.ellipse(340,475,105,155,0,0,7);x.fill();dust.forEach(p=>{x.globalAlpha=p.a;x.fillStyle='#78eced';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});bubbles.forEach(p=>{x.globalAlpha=p.a;x.strokeStyle='#b1fbff';x.lineWidth=1;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.stroke()});x.globalAlpha=1}
function ship(){let px=player.x,py=player.y;x.save();if(player.inv&&Math.floor(player.inv/5)%2===0)x.globalAlpha=.32;if(player.shield){x.strokeStyle=`rgba(91,245,255,${.48+Math.sin(time*.009)*.17})`;x.lineWidth=2.5;x.shadowBlur=16;x.shadowColor='#53ffff';x.beginPath();x.arc(px,py,30,0,7);x.stroke()}let b=x.createLinearGradient(px,py-8,px,py-100);b.addColorStop(0,'rgba(115,255,245,.18)');b.addColorStop(1,'rgba(115,255,245,0)');x.fillStyle=b;x.beginPath();x.moveTo(px-10,py-13);x.lineTo(px-42,py-100);x.lineTo(px+42,py-100);x.lineTo(px+10,py-13);x.fill();x.shadowBlur=16;x.shadowColor='#47eee8';x.fillStyle='#36d3ca';x.beginPath();x.ellipse(px,py,20,14,0,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#ffda60';x.beginPath();x.ellipse(px,py,13,10,0,0,7);x.fill();x.fillStyle='#0d374e';x.beginPath();x.arc(px,py-1,6,0,7);x.fill();glow(px,py-1,4,'#85ffff',8);glow(px-15,py-2,2.8,'#b7ffff',10);glow(px+15,py-2,2.8,'#b7ffff',10);x.restore()}
function angler(e){x.save();x.translate(e.x,e.y);x.fillStyle='#d28b32';x.beginPath();x.ellipse(0,2,20,14,0,0,7);x.fill();x.fillStyle='#f5bd4c';x.beginPath();x.moveTo(-8,-9);x.lineTo(-25,-19);x.lineTo(-18,1);x.fill();x.strokeStyle='#efbf55';x.lineWidth=1.8;x.beginPath();x.moveTo(6,-10);x.quadraticCurveTo(14,-28,24,-22);x.stroke();glow(24,-22,3,'#ffe57b',14);x.fillStyle='#fff';x.beginPath();x.arc(9,-1,3,0,7);x.fill();x.restore()}
function squid(e,big=false){x.save();x.translate(e.x,e.y);let s=big?1.26:1;x.scale(s,s);x.shadowBlur=big?22:10;x.shadowColor='#ea77d1';x.fillStyle=big?'#bb418c':'#d55db8';x.beginPath();x.moveTo(0,-e.r*.78);x.quadraticCurveTo(e.r*.78,-e.r*.2,e.r*.62,e.r*.45);x.quadraticCurveTo(0,e.r*.22,-e.r*.62,e.r*.45);x.quadraticCurveTo(-e.r*.78,-e.r*.2,0,-e.r*.78);x.fill();x.shadowBlur=0;x.strokeStyle=big?'#f391dc':'#ee99dc';x.lineWidth=big?3:2;let n=big?7:5;for(let i=0;i<n;i++){let bx=-e.r*.48+i*(e.r*.96/(n-1));x.beginPath();x.moveTo(bx,e.r*.28);x.quadraticCurveTo(bx+Math.sin(e.t+i)*10,e.r*(big?1.25:1.05),bx+Math.sin(e.t*1.5+i)*13,e.r*(big?1.6:1.35));x.stroke()}x.fillStyle='#efffff';x.beginPath();x.arc(-8,-3,3,0,7);x.arc(8,-3,3,0,7);x.fill();x.restore()}
function mega(e){x.save();x.translate(e.x,e.y);x.fillStyle='#159e94';x.beginPath();x.ellipse(0,0,28,19,0,0,7);x.fill();x.fillStyle='#082c3c';x.beginPath();x.ellipse(-2,4,18,10,0,0,7);x.fill();x.strokeStyle='#83f6da';x.beginPath();x.ellipse(-2,4,14,7,0,0,7);x.stroke();x.fillStyle='#d7ffff';x.beginPath();x.arc(13,-7,3,0,7);x.fill();x.restore()}
function draw(){x.save();x.translate(shake?(Math.random()-.5)*shake:0,shake?(Math.random()-.5)*shake:0);bg();bullets.forEach(b=>{x.strokeStyle='#7effff';x.lineWidth=3.5;x.shadowBlur=14;x.shadowColor='#55ffff';x.beginPath();x.moveTo(b.x,b.y+8);x.lineTo(b.x,b.y-8);x.stroke();x.shadowBlur=0});bad.forEach(b=>glow(b.x,b.y,b.r,b.col,12));enemies.forEach(e=>e.type==='angler'?angler(e):e.type==='mega'?mega(e):squid(e,e.boss));items.forEach(p=>{x.save();x.translate(p.x,p.y);x.rotate(p.t);x.strokeStyle=p.type==='shield'?'#61f6ff':'#ffea69';x.lineWidth=2;x.shadowBlur=12;x.shadowColor=x.strokeStyle;x.beginPath();x.moveTo(0,-11);x.lineTo(11,0);x.lineTo(0,11);x.lineTo(-11,0);x.closePath();x.stroke();x.restore()});ship();parts.forEach(p=>{x.globalAlpha=p.a;glow(p.x,p.y,p.r,p.col,8)});x.globalAlpha=1;if(flash){x.fillStyle=`rgba(215,255,255,${flash/30})`;x.fillRect(0,0,W,H)}x.restore()}
function loop(t){if(!running)return;let dt=Math.min(40,t-last);last=t;update(dt);draw();requestAnimationFrame(loop)}
function idle(){if(running)return;if(!dust.length){reset()}dust.forEach(p=>{p.y+=p.v*.5;if(p.y>H)p.y=-2});bubbles.forEach(p=>{p.y-=p.v*.45;if(p.y<-12)Object.assign(p,bubble())});bg();requestAnimationFrame(idle)} idle();
})();
</script></body></html>
