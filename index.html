<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>STAR GUARDIAN - 宇宙シューティング</title>
<style>
  :root{
    --bg:#050816;
    --panel:rgba(10,18,43,.72);
    --line:rgba(120,190,255,.34);
    --text:#ecf7ff;
    --accent:#69d8ff;
    --danger:#ff5172;
    --gold:#ffe17a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;background:#02040d;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
  body{display:grid;place-items:center;touch-action:none}
  #frame{
    position:relative;height:100dvh;max-height:100dvh;aspect-ratio:9/16;max-width:100vw;
    overflow:hidden;background:var(--bg);box-shadow:0 0 38px rgba(60,150,255,.22);
  }
  canvas{display:block;width:100%;height:100%;background:transparent}
  #hud{
    position:absolute;left:0;right:0;top:max(10px, env(safe-area-inset-top));
    padding:0 12px;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;
    font-size:12px;font-weight:700;letter-spacing:.06em;text-shadow:0 1px 4px #000;
  }
  .hudBox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:82px}
  #rightHud{text-align:right}
  #hpRow{position:absolute;top:max(60px, calc(env(safe-area-inset-top) + 48px));left:12px;right:12px;
    display:flex;gap:8px;align-items:center;pointer-events:none;font-size:11px;font-weight:800}
  #hpbar{height:8px;flex:1;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}
  #hpfill{width:100%;height:100%;background:linear-gradient(90deg,#3fe1aa,#75e8ff);transition:width .15s}
  #bossRow{display:none;position:absolute;top:max(84px, calc(env(safe-area-inset-top) + 72px));left:25px;right:25px;
    align-items:center;gap:8px;pointer-events:none;font-size:10px;font-weight:900;color:#ffb8c5}
  #bossbar{height:8px;flex:1;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
  #bossfill{width:100%;height:100%;background:linear-gradient(90deg,#ff3b61,#ff996f)}
  #controls{
    position:absolute;left:0;right:0;bottom:max(14px, env(safe-area-inset-bottom));
    display:flex;justify-content:flex-end;align-items:end;padding:0 14px;pointer-events:none;
  }
  #nova{
    pointer-events:auto;width:74px;height:74px;border-radius:50%;border:1px solid rgba(255,224,120,.66);
    color:#fff7d1;background:radial-gradient(circle,#c97914 0%,#662411 65%,#241219 100%);
    font-size:12px;font-weight:900;letter-spacing:.05em;box-shadow:0 0 18px rgba(255,185,58,.4);
  }
  #nova:disabled{opacity:.38;box-shadow:none}
  #nova small{display:block;font-size:9px;font-weight:700;opacity:.8}
  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:26px;background:linear-gradient(180deg,rgba(3,6,18,.38),rgba(3,6,18,.9));
    text-align:center;
  }
  .hidden{display:none}
  h1{font-size:31px;line-height:1.05;margin:0 0 9px;letter-spacing:.14em;
    color:#fff;text-shadow:0 0 16px rgba(83,212,255,.8)}
  .sub{margin:0 0 26px;color:#a8ccec;font-size:13px;letter-spacing:.13em}
  .howto{width:100%;background:rgba(8,16,38,.7);border:1px solid var(--line);border-radius:17px;
    padding:17px 16px;line-height:1.75;font-size:14px;margin-bottom:23px}
  .startBtn{
    width:85%;padding:16px 10px;border:0;border-radius:16px;color:#061428;font-size:16px;font-weight:900;
    letter-spacing:.14em;background:linear-gradient(90deg,#62dbff,#a8f2ff);
    box-shadow:0 0 20px rgba(83,212,255,.42);
  }
  #result{font-size:14px;line-height:2;margin:6px 0 20px}
  #waveNotice{
    position:absolute;top:28%;left:0;right:0;text-align:center;font-size:25px;font-weight:900;
    letter-spacing:.16em;color:#d8f5ff;text-shadow:0 0 17px #34beff;opacity:0;pointer-events:none;
    transform:scale(.92);transition:opacity .22s,transform .22s;
  }
  #waveNotice.show{opacity:1;transform:scale(1)}
</style>
</head>
<body>
<div id="frame">
  <canvas id="game" aria-label="宇宙シューティングゲーム"></canvas>
  <div id="hud">
    <div class="hudBox">SCORE<br><span id="score">000000</span></div>
    <div id="rightHud" class="hudBox">HIGH <span id="high">000000</span><br>WAVE <span id="wave">1</span></div>
  </div>
  <div id="hpRow"><span>SHIP</span><div id="hpbar"><div id="hpfill"></div></div></div>
  <div id="bossRow"><span>BOSS</span><div id="bossbar"><div id="bossfill"></div></div></div>
  <div id="waveNotice"></div>
  <div id="controls"><button id="nova" disabled>NOVA<small id="novaCount">0 / 100</small></button></div>

  <section id="startScreen" class="overlay">
    <h1>STAR<br>GUARDIAN</h1>
    <p class="sub">SPACE SHOOTING GAME</p>
    <div class="howto">
      指で宇宙船を動かして敵を撃破<br>
      射撃は自動で発射<br>
      ゲージが満タンになったら <b>NOVA</b> で全体攻撃
    </div>
    <button id="startBtn" class="startBtn">MISSION START</button>
  </section>

  <section id="gameOver" class="overlay hidden">
    <h1>MISSION<br>FAILED</h1>
    <div id="result"></div>
    <button id="retryBtn" class="startBtn">RETRY</button>
  </section>
</div>
<script>
(() => {
  'use strict';
  const cvs = document.getElementById('game');
  const ctx = cvs.getContext('2d');
  const frame = document.getElementById('frame');
  const scoreEl = document.getElementById('score');
  const highEl = document.getElementById('high');
  const waveEl = document.getElementById('wave');
  const hpFill = document.getElementById('hpfill');
  const bossRow = document.getElementById('bossRow');
  const bossFill = document.getElementById('bossfill');
  const novaBtn = document.getElementById('nova');
  const novaCount = document.getElementById('novaCount');
  const notice = document.getElementById('waveNotice');
  const startScreen = document.getElementById('startScreen');
  const overScreen = document.getElementById('gameOver');
  const resultEl = document.getElementById('result');

  const W = 360, H = 640;
  let scale = 1, dpr = Math.min(devicePixelRatio || 1, 2);
  function resize(){
    cvs.width = W * dpr; cvs.height = H * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  addEventListener('resize', resize);

  let running = false, last = 0, elapsed = 0, score = 0, high = +localStorage.getItem('star_guardian_high') || 0;
  let wave = 1, waveTimer = 0, spawnTimer = 0, fireTimer = 0, shake = 0, flash = 0;
  let bullets=[], enemies=[], enemyBullets=[], particles=[], powerups=[], stars=[], rings=[];
  let pointer = {x:W/2, y:H-100, active:false};
  let boss = null, nova = 0, rapid = 0, shield = 0;
  let player = {};

  highEl.textContent = String(high).padStart(6,'0');
  for(let i=0;i<72;i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.25,s:Math.random()*1.3+.25,a:Math.random()*.65+.3});

  function reset(){
    score=0; wave=1; elapsed=0; waveTimer=0; spawnTimer=0; fireTimer=0; shake=0; flash=0;
    bullets=[]; enemies=[]; enemyBullets=[]; particles=[]; powerups=[]; rings=[];
    boss=null; nova=0; rapid=0; shield=0;
    player={x:W/2,y:H-90,r:15,hp:100,inv:0,targetX:W/2,targetY:H-90};
    pointer.x=player.x; pointer.y=player.y;
    updateHud();
  }
  function start(){
    reset();
    startScreen.classList.add('hidden'); overScreen.classList.add('hidden');
    running=true; last=performance.now(); announce('WAVE 1');
    requestAnimationFrame(loop);
  }
  document.getElementById('startBtn').onclick=start;
  document.getElementById('retryBtn').onclick=start;

  function posFromEvent(e){
    const rect=cvs.getBoundingClientRect();
    const t=e.touches ? e.touches[0] : e;
    return {x:(t.clientX-rect.left)/rect.width*W, y:(t.clientY-rect.top)/rect.height*H};
  }
  function down(e){
    if(!running || e.target===novaBtn) return;
    e.preventDefault(); pointer.active=true;
    const p=posFromEvent(e); pointer.x=p.x; pointer.y=p.y;
  }
  function move(e){
    if(!running || !pointer.active) return;
    e.preventDefault();
    const p=posFromEvent(e); pointer.x=p.x; pointer.y=p.y;
  }
  function up(){ pointer.active=false; }
  cvs.addEventListener('touchstart',down,{passive:false});
  cvs.addEventListener('touchmove',move,{passive:false});
  cvs.addEventListener('touchend',up);
  cvs.addEventListener('mousedown',down);
  addEventListener('mousemove',move);
  addEventListener('mouseup',up);

  novaBtn.onclick = (e) => {
    e.stopPropagation();
    if(!running || nova<100) return;
    nova=0; flash=16; shake=18;
    rings.push({x:player.x,y:player.y,r:10,a:1});
    enemies.forEach(en => hitEnemy(en, en.boss ? 18 : 999));
    enemyBullets.length=0;
    burst(player.x,player.y,'#ffe886',40);
    updateHud();
  };

  function announce(text){
    notice.textContent=text;
    notice.classList.add('show');
    setTimeout(()=>notice.classList.remove('show'),850);
  }
  function updateHud(){
    scoreEl.textContent=String(score).padStart(6,'0');
    highEl.textContent=String(high).padStart(6,'0');
    waveEl.textContent=wave;
    hpFill.style.width=Math.max(0,player.hp)+'%';
    hpFill.style.background=player.hp<35?'linear-gradient(90deg,#ff4261,#ff9b72)':'linear-gradient(90deg,#3fe1aa,#75e8ff)';
    novaBtn.disabled=nova<100;
    novaCount.textContent=`${Math.floor(nova)} / 100`;
    if(boss){
      bossRow.style.display='flex';
      bossFill.style.width=(boss.hp/boss.maxHp*100)+'%';
    } else bossRow.style.display='none';
  }

  function spawnEnemy(type='scout'){
    if(type==='boss'){
      const maxHp=95+wave*16;
      boss={x:W/2,y:-65,r:42,hp:maxHp,maxHp,vy:0.55,shoot:25,t:0,boss:true,points:1000};
      enemies.push(boss); return;
    }
    const types={
      scout:{r:13,hp:2,vy:1.65+wave*.08,points:80,col:'#ff5f87'},
      zig:{r:15,hp:4,vy:1.18+wave*.07,points:140,col:'#ffac62'},
      heavy:{r:20,hp:9,vy:.74+wave*.04,points:260,col:'#b58cff'}
    };
    const e={...types[type],type,x:24+Math.random()*(W-48),y:-25,t:Math.random()*6.2,shoot:40+Math.random()*55};
    enemies.push(e);
  }
  function shoot(){
    const count=rapid>0?2:1;
    for(let i=0;i<count;i++){
      const offset=count===2?(i?8:-8):0;
      bullets.push({x:player.x+offset,y:player.y-18,vx:offset*.035,vy:rapid>0?-9.2:-8.1,r:3.2,d:rapid>0?2:1});
    }
  }
  function enemyShot(e, spread=false){
    const dx=player.x-e.x, dy=player.y-e.y;
    const len=Math.hypot(dx,dy)||1;
    const base=Math.atan2(dy,dx);
    const arr=spread?[-.33,0,.33]:[0];
    arr.forEach(a=>enemyBullets.push({x:e.x,y:e.y+e.r*.55,vx:Math.cos(base+a)*2.05,vy:Math.sin(base+a)*2.05,r:4}));
  }
  function burst(x,y,col,n=10){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, sp=Math.random()*3.4+.45;
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:Math.random()*3+1.1,a:1,col});
    }
  }
  function hitEnemy(e, damage){
    if(e.dead) return;
    e.hp-=damage; burst(e.x,e.y,e.col||'#ff708a',damage>5?12:3);
    if(e.hp<=0){
      e.dead=true; score+=e.points; nova=Math.min(100,nova+(e.boss?45:e.type==='heavy'?16:8));
      burst(e.x,e.y,e.col||'#ff7790',e.boss?48:18);
      if(!e.boss && Math.random()<.12) powerups.push({x:e.x,y:e.y,vy:1.45,type:Math.random()<.54?'rapid':'shield',r:10,t:0});
      if(e.boss){ boss=null; score+=wave*180; flash=10; announce('BOSS DEFEATED'); }
      if(score>high){high=score; localStorage.setItem('star_guardian_high', high);}
      updateHud();
    }
  }
  function hurt(d){
    if(player.inv>0) return;
    player.hp-=d; player.inv=65; shake=10; burst(player.x,player.y,'#65e9ff',18);
    updateHud();
    if(player.hp<=0) finish();
  }
  function finish(){
    running=false;
    resultEl.innerHTML=`SCORE　<b>${String(score).padStart(6,'0')}</b><br>到達 WAVE　<b>${wave}</b><br>HIGH SCORE　<b>${String(high).padStart(6,'0')}</b>`;
    overScreen.classList.remove('hidden');
  }

  function update(){
    elapsed++;
    stars.forEach(s=>{s.y+=s.s*(1+wave*.025); if(s.y>H+3){s.y=-3;s.x=Math.random()*W;}});
    player.inv=Math.max(0,player.inv-1);
    rapid=Math.max(0,rapid-1);
    shield=Math.max(0,shield-1);
    if(pointer.active){ player.targetX=pointer.x; player.targetY=Math.min(H-48,Math.max(115,pointer.y)); }
    player.x+=(player.targetX-player.x)*.22;
    player.y+=(player.targetY-player.y)*.22;
    player.x=Math.min(W-19,Math.max(19,player.x));

    fireTimer--;
    if(fireTimer<=0){shoot(); fireTimer=rapid>0?7:14;}

    waveTimer++;
    const bossWave = wave%5===0;
    if(bossWave && !boss && enemies.filter(e=>!e.dead).length===0 && waveTimer>32){
      spawnEnemy('boss'); announce('WARNING  BOSS');
    }
    if(!bossWave && !boss){
      spawnTimer--;
      if(spawnTimer<=0){
        let type=Math.random()<.18+wave*.012?'heavy':Math.random()<.43?'zig':'scout';
        spawnEnemy(type);
        spawnTimer=Math.max(22,63-wave*2)+Math.random()*22;
      }
    }
    const clearedBoss = bossWave && waveTimer>80 && !boss && enemies.filter(e=>!e.dead).length===0;
    const regularDone = !bossWave && waveTimer>760;
    if(clearedBoss || regularDone){
      wave++; waveTimer=0; spawnTimer=10; enemies=[]; enemyBullets=[]; boss=null;
      announce(`WAVE ${wave}`); updateHud();
    }

    bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy});
    bullets=bullets.filter(b=>b.y>-20 && !b.dead);

    enemies.forEach(e=>{
      e.t+=.045;
      if(e.boss){
        if(e.y<78)e.y+=e.vy;
        else e.x=W/2+Math.sin(e.t*.7)*100;
        e.shoot--;
        if(e.shoot<=0){ enemyShot(e,true); e.shoot=Math.max(28,62-wave*2); }
      }else{
        e.y+=e.vy;
        if(e.type==='zig')e.x+=Math.sin(e.t)*2;
        if(e.type==='heavy'){
          e.shoot--;
          if(e.shoot<=0 && e.y>20 && e.y<H*.65){enemyShot(e,false);e.shoot=105;}
        }
        if(e.y>H+35){e.dead=true; hurt(8);}
      }
      bullets.forEach(b=>{
        if(!b.dead && !e.dead && Math.hypot(b.x-e.x,b.y-e.y)<e.r+b.r){
          b.dead=true; hitEnemy(e,b.d);
        }
      });
      if(!e.dead && Math.hypot(player.x-e.x,player.y-e.y)<player.r+e.r){
        e.dead=true; hurt(e.boss?35:22); burst(e.x,e.y,e.col||'#ff607c',18);
      }
    });
    enemies=enemies.filter(e=>!e.dead);

    enemyBullets.forEach(b=>{
      b.x+=b.vx; b.y+=b.vy;
      if(Math.hypot(player.x-b.x,player.y-b.y)<player.r+b.r){
        b.dead=true;
        if(shield>0){shield=0;burst(player.x,player.y,'#8eeeff',24);}
        else hurt(14);
      }
    });
    enemyBullets=enemyBullets.filter(b=>!b.dead&&b.y<H+15&&b.x>-15&&b.x<W+15);

    powerups.forEach(p=>{
      p.y+=p.vy;p.t+=.12;
      if(Math.hypot(player.x-p.x,player.y-p.y)<player.r+p.r+5){
        p.dead=true;
        if(p.type==='rapid'){rapid=520; announce('RAPID SHOT');}
        else {shield=520; announce('SHIELD');}
        burst(p.x,p.y,p.type==='rapid'?'#ffe06c':'#70e7ff',20);
      }
    });
    powerups=powerups.filter(p=>!p.dead&&p.y<H+18);

    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy*=.97;p.a-=.035;p.r*=.985});
    particles=particles.filter(p=>p.a>0);
    rings.forEach(r=>{r.r+=17;r.a-=.048});
    rings=rings.filter(r=>r.a>0);
    shake=Math.max(0,shake-1); flash=Math.max(0,flash-1);
  }

  function drawStar(x,y,r,a){
    ctx.globalAlpha=a; ctx.fillStyle='#c9eaff'; ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.globalAlpha=1;
  }
  function drawShip(){
    const x=player.x,y=player.y;
    ctx.save();
    if(player.inv>0 && Math.floor(player.inv/4)%2===0) ctx.globalAlpha=.35;
    if(shield>0){
      ctx.strokeStyle=`rgba(100,224,255,${.45+Math.sin(elapsed*.15)*.18})`;
      ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,25,0,7);ctx.stroke();
    }
    const grd=ctx.createRadialGradient(x,y+16,1,x,y+16,21);
    grd.addColorStop(0,'rgba(82,221,255,.9)');grd.addColorStop(1,'rgba(82,221,255,0)');
    ctx.fillStyle=grd;ctx.beginPath();ctx.arc(x,y+18,21,0,7);ctx.fill();
    ctx.fillStyle='#dceeff';ctx.beginPath();ctx.moveTo(x,y-20);ctx.lineTo(x+15,y+14);ctx.lineTo(x+5,y+10);ctx.lineTo(x,y+18);ctx.lineTo(x-5,y+10);ctx.lineTo(x-15,y+14);ctx.closePath();ctx.fill();
    ctx.fillStyle='#37cfff';ctx.beginPath();ctx.moveTo(x,y-13);ctx.lineTo(x+5,y+7);ctx.lineTo(x-5,y+7);ctx.closePath();ctx.fill();
    ctx.restore();
  }
  function drawEnemy(e){
    ctx.save();ctx.translate(e.x,e.y);
    if(e.boss){
      ctx.fillStyle='#40234f';ctx.beginPath();ctx.moveTo(0,-e.r);ctx.lineTo(e.r+8,-8);ctx.lineTo(e.r-2,25);ctx.lineTo(17,18);ctx.lineTo(0,34);ctx.lineTo(-17,18);ctx.lineTo(-e.r+2,25);ctx.lineTo(-e.r-8,-8);ctx.closePath();ctx.fill();
      ctx.strokeStyle='#ff5d79';ctx.lineWidth=3;ctx.stroke();
      ctx.fillStyle='#ff375d';ctx.beginPath();ctx.arc(0,3,13,0,7);ctx.fill();
      ctx.fillStyle='#ffd6dd';ctx.beginPath();ctx.arc(0,3,5,0,7);ctx.fill();
    } else if(e.type==='heavy'){
      ctx.fillStyle=e.col;ctx.beginPath();ctx.moveTo(0,e.r);ctx.lineTo(-e.r,-5);ctx.lineTo(-9,-e.r);ctx.lineTo(9,-e.r);ctx.lineTo(e.r,-5);ctx.closePath();ctx.fill();
      ctx.fillStyle='#32224f';ctx.fillRect(-10,-4,20,8);
    } else {
      ctx.fillStyle=e.col;ctx.beginPath();ctx.moveTo(0,e.r);ctx.lineTo(-e.r,-e.r*.45);ctx.lineTo(-6,-e.r);ctx.lineTo(0,-e.r*.55);ctx.lineTo(6,-e.r);ctx.lineTo(e.r,-e.r*.45);ctx.closePath();ctx.fill();
      ctx.fillStyle='#ffe9f1';ctx.beginPath();ctx.arc(0,-2,3,0,7);ctx.fill();
    }
    ctx.restore();
  }
  function draw(){
    ctx.save();
    const sx=shake?(Math.random()-.5)*shake:0, sy=shake?(Math.random()-.5)*shake:0;
    ctx.translate(sx,sy);
    ctx.clearRect(-20,-20,W+40,H+40);
    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#04081b');bg.addColorStop(.5,'#07162d');bg.addColorStop(1,'#030510');
    ctx.fillStyle=bg;ctx.fillRect(-20,-20,W+40,H+40);
    stars.forEach(s=>drawStar(s.x,s.y,s.r,s.a));
    ctx.globalAlpha=.08;ctx.fillStyle='#62d9ff';ctx.beginPath();ctx.arc(W*.22,H*.3,100,0,7);ctx.fill();ctx.globalAlpha=1;
    rings.forEach(r=>{ctx.globalAlpha=r.a;ctx.strokeStyle='#fff3a1';ctx.lineWidth=4;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke();ctx.globalAlpha=1});
    bullets.forEach(b=>{
      ctx.strokeStyle=rapid>0?'#ffe47b':'#53eaff';ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(b.x,b.y+8);ctx.lineTo(b.x,b.y-7);ctx.stroke();
    });
    enemyBullets.forEach(b=>{
      ctx.fillStyle='#ff506c';ctx.shadowBlur=10;ctx.shadowColor='#ff365e';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.shadowBlur=0;
    });
    enemies.forEach(drawEnemy);
    powerups.forEach(p=>{
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.t);
      ctx.strokeStyle=p.type==='rapid'?'#ffe170':'#6feaff';ctx.fillStyle=p.type==='rapid'?'rgba(255,225,112,.2)':'rgba(111,234,255,.2)';
      ctx.lineWidth=2;ctx.beginPath();ctx.rect(-9,-9,18,18);ctx.fill();ctx.stroke();ctx.restore();
      ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText(p.type==='rapid'?'R':'S',p.x,p.y+3);
    });
    drawShip();
    particles.forEach(p=>{ctx.globalAlpha=p.a;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()});
    ctx.globalAlpha=1;
    if(flash){ctx.globalAlpha=flash/20;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
    ctx.restore();
  }
  function idle(){
    stars.forEach(s=>{s.y+=s.s*.45;if(s.y>H){s.y=-2;s.x=Math.random()*W;}});
    ctx.clearRect(0,0,W,H);
    const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#04081b');bg.addColorStop(1,'#030510');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    stars.forEach(s=>drawStar(s.x,s.y,s.r,s.a));
    if(!running) requestAnimationFrame(idle);
  }
  function loop(t){
    if(!running) return;
    const dt=t-last; last=t;
    if(dt<70) update();
    draw();
    requestAnimationFrame(loop);
  }
  idle();
})();
</script>
